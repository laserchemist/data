<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A41E35"/>
      <stop offset="100%" stop-color="#7A1626"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- ear tufts -->
  <path d="M17 22 L23 10 L27 24 Z" fill="#FFFFFF"/>
  <path d="M47 22 L41 10 L37 24 Z" fill="#FFFFFF"/>

