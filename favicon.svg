  <circle cx="24" cy="35" r="4.2" fill="#FFFFFF"/>
  <circle cx="40" cy="35" r="4.2" fill="#FFFFFF"/>
  <circle cx="24" cy="35" r="2" fill="#222222"/>
  <circle cx="40" cy="35" r="2" fill="#222222"/>

  <!-- beak -->
